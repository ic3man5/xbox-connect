[package]
name = "xbox-connect"
version = "0.1.0"
edition = "2024"
description = "Keeps Xbox Wireless Controllers connected over Bluetooth on Windows, with a live input view and tray icon."
license = "MIT"

[dependencies]
egui = { version = "0.32", default-features = false }
egui_glow = { version = "0.32", default-features = false, features = ["winit"] }
glutin = { version = "0.32", default-features = false, features = ["wgl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
tray-icon = "0.26"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Power",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
